name: Dual-OS bins

# Builds both firmwares of the dual-OS setup as flashable app images:
#   dist/crosspoint-<ver>-ota0.bin  (repo root project)
#   dist/biscuit-<rev>-ota1.bin     (vendored biscuit/ project)
# The -ota0/-ota1 suffixes are labels only — images are slot-agnostic and the
# on-device SD flasher always writes the passive slot. A biscuit link failure
# ("does not fit") means the app outgrew the shared 0x640000 slot; see
# biscuit/LOCAL_PATCHES.md (P2).

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: dual-os-bins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-crosspoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap isn't picking them up reliably on the runner image, so pin them
          # explicitly (same list as ci.yml).
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-gh_release-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v3-${{ runner.os }}-gh_release-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from ~/.platformio/penv, whose
          # open-ended "pioarduino>=6.1.19" now resolves to 6.2.0 and fights the platform's
          # tool-scons pin. Keep the penv core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossPoint (ota0)
        run: |
          set -euo pipefail
          make -C tools crosspoint | tee pio.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          {
            echo "## CrossPoint (ota0) build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute artifact ref
        # Branch refs contain '/', which artifact names forbid.
        run: echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: crosspoint-${{ env.SAFE_REF }}-ota0
          path: |
            dist/crosspoint-*-ota0.bin
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/partitions.bin
          if-no-files-found: error

  build-biscuit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-biscuit-${{ hashFiles('biscuit/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build Biscuit (ota1)
        run: |
          set -euo pipefail
          make -C tools biscuit | tee pio.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          {
            echo "## Biscuit (ota1) build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute artifact ref
        # Branch refs contain '/', which artifact names forbid.
        run: echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: biscuit-${{ env.SAFE_REF }}-ota1
          path: dist/biscuit-*-ota1.bin
          if-no-files-found: error
